<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 登入</title>
    <style>
        /* ... 樣式保持不變 ... */
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #loginBox { max-width: 350px; width: 90%; background: white; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin-bottom: 10px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div><div>加速登入中...</div></div>
    <div id="loginBox">
        <h2>📦 冰箱小管家</h2>
        <input type="text" id="codeIn" placeholder="輸入專屬代碼" style="text-align:center; text-transform:uppercase;">
        <button onclick="doLogin()">🚀 登入</button>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbxopM8pW0eTWY0cQPzhcYvsb8S27Uh3DITiEhq8wVU1JvbtIkte18hYvK49WdrNCGLV/exec";

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            
            document.getElementById("loader").style.display = "flex";
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "checkCode", code: code })
            })
            .then(r => r.json())
            .then(res => {
                if(res.valid) {
                    localStorage.setItem("pass_code", code);
                    // 🚀 關鍵優化：把順便抓回來的資料直接存入快取
                    if(res.data) localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    window.location.href = "main.html";
                } else {
                    document.getElementById("loader").style.display = "none";
                    alert("❌ 代碼錯誤");
                }
            })
            .catch(e => {
                document.getElementById("loader").style.display = "none";
                alert("連線超時");
            });
        }

        window.onload = function() {
            if(localStorage.getItem("pass_code")) window.location.href = "main.html";
        };
    </script>
</body>
</html>
