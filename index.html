<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冰箱小管家 - 入口</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #f4f7f6; margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center; color: #333;
        }
        .login-box {
            background: white; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 85%; max-width: 320px; text-align: center;
        }
        h1 { margin-top: 0; color: #2c3e50; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: #95a5a6; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 25px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border: 2px solid #ecf0f1; border-radius: 10px;
            box-sizing: border-box; font-size: 18px; text-align: center;
            outline: none; transition: 0.3s; letter-spacing: 2px; font-weight: bold;
            text-transform: uppercase; 
        }
        input:focus { border-color: #3498db; }
        
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: #3498db; color: white; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        .btn-primary:active { transform: scale(0.96); }
        
        .divider { margin: 20px 0; border-top: 1px solid #eee; position: relative; }
        .divider span {
            background: white; padding: 0 10px; color: #aaa; font-size: 12px;
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
        }

        .btn-outline { background: white; border: 2px solid #2ecc71; color: #2ecc71; }
        .btn-outline:active { background: #2ecc71; color: white; }

        #loading { display: none; margin-top: 15px; color: #666; font-size: 14px; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🥦 冰箱小管家</h1>
        <div class="subtitle">輸入代碼或建立新冰箱</div>
        
        <div class="input-group">
            <input type="text" id="passCode" placeholder="輸入 6 位代碼" maxlength="6" onkeyup="handleKeyup(event)">
            <div id="errorMsg" class="error-msg"></div>
            <button id="loginBtn" class="btn btn-primary" onclick="doLogin()">進入冰箱</button>
        </div>

        <div class="divider"><span>或是</span></div>

        <button id="createBtn" class="btn btn-outline" onclick="doCreate()">✨ 建立一個新的冰箱代碼</button>
        
        <div id="loading">連線中...</div>
    </div>

    <script>
        // ⚠️ 請替換成你的 Google Apps Script 網址 ⚠️
        var API_URL = "https://script.google.com/macros/s/AKfycbzzDNndrlyR0OYg-cCTT0ZrNtaUuEX6q65PL6hZ9GqhCBx0WfM03UeIQfIWXX7k_SxW/exec";

        function handleKeyup(e) {
            e.target.value = e.target.value.toUpperCase();
            document.getElementById("errorMsg").style.display = 'none';
            if(e.key === 'Enter') doLogin();
        }

        function setLoading(isLoading, text) {
            var loadDiv = document.getElementById("loading");
            var lBtn = document.getElementById("loginBtn");
            var cBtn = document.getElementById("createBtn");
            
            if(isLoading) {
                loadDiv.innerText = text || "連線中...";
                loadDiv.style.display = "block";
                lBtn.disabled = true; cBtn.disabled = true;
            } else {
                loadDiv.style.display = "none";
                lBtn.disabled = false; cBtn.disabled = false;
            }
        }

        function doLogin() {
            var code = document.getElementById("passCode").value.trim().toUpperCase();
            if (code.length < 6) return showError("請輸入完整的 6 位代碼");

            setLoading(true, "驗證代碼中...");

            // 呼叫後端 getList 驗證代碼
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "action=getList&code=" + encodeURIComponent(code)
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success") {
                    enterApp(code, res.data);
                } else {
                    showError(res.error || "代碼無效，請檢查。");
                    setLoading(false);
                }
            })
            .catch(e => {
                console.error(e);
                showError("連線失敗，請檢查網路");
                setLoading(false);
            });
        }

        function doCreate() {
            if(!confirm("系統將會產生一組新的隨機代碼給您，確定嗎？")) return;

            setLoading(true, "正在產生代碼...");

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "action=create"
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success" && res.data.code) {
                    var newCode = res.data.code;
                    alert("🎉 建立成功！\n您的新代碼是： " + newCode + "\n請務必記住此代碼。");
                    document.getElementById("passCode").value = newCode;
                    enterApp(newCode, null); 
                } else {
                    showError("建立失敗，請稍後再試。");
                    setLoading(false);
                }
            })
            .catch(e => {
                showError("連線錯誤");
                setLoading(false);
            });
        }

        function enterApp(code, data) {
            localStorage.setItem("pass_code", code);
            if(data) localStorage.setItem("cached_fridge_data", JSON.stringify(data));
            window.location.href = "main.html";
        }

        function showError(msg) {
            var el = document.getElementById("errorMsg");
            el.innerText = msg;
            el.style.display = "block";
            if(navigator.vibrate) navigator.vibrate(200);
        }

        window.onload = function() {
            var saved = localStorage.getItem("pass_code");
            if(saved) document.getElementById("passCode").value = saved;
        }
    </script>
</body>
</html>
