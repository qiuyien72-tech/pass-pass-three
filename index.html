<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 登入</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      body { 
          font-family: 'Noto Sans TC', sans-serif;
          /* 居家感背景圖 + 酷炫暗色遮罩 */
          background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
          background-size: cover;
          background-position: center;
          margin: 0; 
          display: flex; 
          align-items: center; 
          justify-content: center; 
          height: 100vh;
          overflow: hidden;
      }

      /* 毛玻璃特效容器 */
      #loginBox { 
          max-width: 350px; 
          width: 85%; 
          padding: 50px 30px; 
          border-radius: 20px;
          text-align: center; 
          
          /* Glassmorphism 核心代碼 */
          background: rgba(255, 255, 255, 0.15);
          backdrop-filter: blur(15px);
          -webkit-backdrop-filter: blur(15px);
          border: 1px solid rgba(255, 255, 255, 0.3);
          box-shadow: 0 15px 35px rgba(0,0,0,0.2);
          color: white;
      }

      h2 {
          font-weight: 300;
          letter-spacing: 2px;
          margin-bottom: 30px;
          text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }

      input { 
          width: 100%; 
          padding: 15px;
          margin-bottom: 20px; 
          border-radius: 30px; /* 圓潤居家感 */
          border: none;
          background: rgba(255, 255, 255, 0.9);
          box-sizing: border-box; 
          font-size: 18px;
          text-align: center; 
          text-transform: uppercase;
          letter-spacing: 3px;
          font-family: 'Courier New', monospace; /* 科技感字體 */
          color: #333;
          box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
          transition: all 0.3s;
      }
      
      input:focus {
          outline: none;
          box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
          transform: scale(1.02);
      }

      button { 
          width: 100%; 
          padding: 15px; 
          margin-bottom: 15px; 
          border-radius: 30px;
          border: none; 
          font-weight: bold; 
          cursor: pointer;
          font-size: 16px;
          transition: all 0.3s;
      }

      /* 主按鈕：漸層科技藍 */
      button:not(.secondary) {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
      }
      button:not(.secondary):active { transform: scale(0.95); }

      /* 次要按鈕：半透明白 */
      .secondary { 
          background: rgba(255, 255, 255, 0.2); 
          color: #fff; 
          border: 1px solid rgba(255,255,255,0.4);
      }
      .secondary:hover {
          background: rgba(255, 255, 255, 0.3); 
      }

      /* Loader 樣式微調 */
      #loader { 
          position: fixed; top:0; left:0; width:100%; height:100%; 
          background: rgba(0,0,0,0.85); /* 改深色背景更酷 */
          display:none; justify-content:center; align-items:center; flex-direction:column;
          z-index: 1000; 
          backdrop-filter: blur(5px);
      }
      .spinner { 
          border: 4px solid rgba(255,255,255,0.1); 
          border-top: 4px solid #00f260; /* 螢光綠 */
          border-radius: 50%;
          width: 50px; height: 50px; 
          animation: spin 0.8s linear infinite; margin-bottom: 20px;
      }
      #loaderText { color: #fff; font-weight: 300; font-size: 14px; letter-spacing: 2px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">SYSTEM CONNECTING...</div>
    </div>

    <div id="loginBox">
        <h2>FRIDGE MANAGER</h2>
        <input type="text" id="codeIn" placeholder="CODE" maxlength="6">
        <button onclick="doLogin()">進入系統</button>
        <button class="secondary" onclick="doRegister()">生成新代碼</button>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";
        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            
            showLoader("VERIFYING...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkCode", code: code }) })
            .then(r => r.json()).then(res => {
                if(res.valid) {
                    showLoader("ACCESS GRANTED");
                    localStorage.setItem("pass_code", code);
                    if(res.data) localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    window.location.href = "main.html"; // 請確保你的主檔名是這個
                } else {
                    hideLoader();
                    alert("❌ 代碼錯誤");
                }
            }).catch(e => { hideLoader(); alert("連線失敗"); });
        }

        function doRegister() {
            showLoader("GENERATING...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "register" }) })
            .then(r => r.json()).then(res => {
                localStorage.setItem("pass_code", res.code);
                alert("註冊成功！代碼: " + res.code);
                window.location.href = "main.html";
            });
        }
        window.onload = function() { if(localStorage.getItem("pass_code")) window.location.href = "main.html"; };
    </script>
</body>
</html>
