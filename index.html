<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 登入</title>
    <style>
      :root {
        --bg-color: #f0f2f5;
        --paper-color: #fff;
        --line-color: #a2a9b1;
        --accent-blue: #007aff;
        --ink-color: #2c3e50;
      }
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background: radial-gradient(#e0e0e0 15%, transparent 16%) 0 0, radial-gradient(#e0e0e0 15%, transparent 16%) 8px 8px;
        background-color: #e8e8e8;
        background-size: 16px 16px;
        margin: 0; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh;
        color: var(--ink-color);
      }
      #loginBox { 
        width: 100%;
        max-width: 320px;
        background: var(--paper-color);
        padding: 40px 30px; 
        position: relative;
        /* 筆記本左側孔洞效果 */
        border-left: 5px solid #333;
        box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
      }
      /* 裝飾：彷彿紙張的質感 */
      #loginBox::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(transparent 95%, #e1e1e1 95%);
        background-size: 100% 24px;
        pointer-events: none;
        z-index: 0;
      }
      h2 {
        position: relative;
        z-index: 1;
        text-align: center;
        margin-bottom: 30px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 3px solid var(--ink-color);
        padding-bottom: 10px;
        display: inline-block;
        width: 100%;
      }
      
      input {
        position: relative;
        z-index: 1;
        width: 100%; 
        padding: 10px 5px; 
        margin-bottom: 25px; 
        background: transparent;
        border: none;
        border-bottom: 2px solid var(--ink-color);
        border-radius: 0;
        font-family: 'Courier Prime', monospace;
        font-size: 18px;
        color: var(--ink-color);
        outline: none;
        transition: border-color 0.3s;
      }
      input:focus {
        border-bottom-color: var(--accent-blue);
      }
      input::placeholder {
        color: #999;
        font-style: italic;
      }

      button { 
        position: relative;
        z-index: 1;
        width: 100%; 
        padding: 14px; 
        margin-bottom: 15px; 
        background: var(--ink-color); 
        color: white; 
        border: none; 
        font-weight: bold; 
        font-family: 'Courier Prime', monospace;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.98);
      }
      
      .secondary { 
        background: transparent; 
        color: var(--ink-color); 
        border: 2px solid var(--ink-color);
      }

      /* Loader */
      #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; z-index: 1000; }
      .spinner { width: 40px; height: 40px; background: var(--ink-color); animation: flip 1.2s infinite; margin-bottom: 15px; }
      #loaderText { color: var(--ink-color); font-weight: bold; font-family: 'Courier Prime', monospace; }
      
      @keyframes flip { 0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); } 50% { transform: perspective(120px) rotateX(-180.1deg) rotateY(0deg); } 100% { transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">CONNECTING...</div>
    </div>

    <div id="loginBox">
        <h2>Fridge Log</h2>
        <input type="text" id="codeIn" placeholder="ENTER ACCESS CODE" style="text-align:center; text-transform:uppercase;">
        <button onclick="doLogin()">[ ENTER SYSTEM ]</button>
        <button class="secondary" onclick="doRegister()">GENERATE NEW CODE</button>
    </div>

    <script>
        // --- 這裡保持原本的 JS 功能完全不變 ---
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";
        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            
            showLoader("VERIFYING...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkCode", code: code }) })
            .then(r => r.json()).then(res => {
                if(res.valid) {
                    showLoader("ACCESS GRANTED");
                    localStorage.setItem("pass_code", code);
                    if(res.data) localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    window.location.href = "main.html";
                } else {
                    hideLoader();
                    alert("❌ INVALID CODE");
                }
            }).catch(e => { hideLoader(); alert("CONNECTION FAILED"); });
        }

        function doRegister() {
            showLoader("GENERATING...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "register" }) })
            .then(r => r.json()).then(res => {
                localStorage.setItem("pass_code", res.code);
                alert("CODE GENERATED: " + res.code);
                window.location.href = "main.html";
            });
        }
        window.onload = function() { if(localStorage.getItem("pass_code")) window.location.href = "main.html"; };
    </script>
</body>
</html>
