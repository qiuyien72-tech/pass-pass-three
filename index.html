<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱小管家 - 登入</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f7f6; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
      #loginSection { max-width: 350px; width: 90%; background: white; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      h2 { margin-top: 0; color: #2c3e50; }
      input, button { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
      button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
      button:active { transform: scale(0.98); }
      .secondary { background: white; color: #3498db; border: 2px dashed #3498db; }
      #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; }
      .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin-bottom:15px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div><div id="loaderText">驗證中...</div></div>

    <div id="loginSection">
        <h2>📦 冰箱小管家</h2>
        <input type="text" id="codeIn" placeholder="輸入您的代碼" style="text-align:center; text-transform:uppercase;">
        <button onclick="doLogin()">🚀 登入</button>
        <button class="secondary" onclick="doRegister()">🎲 產生新代碼</button>
    </div>

    <script>
        // 請務必確認 API 網址正確
        var API_URL = "https://script.google.com/macros/s/AKfycbxopM8pW0eTWY0cQPzhcYvsb8S27Uh3DITiEhq8wVU1JvbtIkte18hYvK49WdrNCGLV/exec";

        function showLoader(t) { document.getElementById("loader").style.display="flex"; document.getElementById("loaderText").innerText=t; }
        function hideLoader() { document.getElementById("loader").style.display="none"; }

        function callApi(action, payload, cb) {
            payload.action = action;
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).then(r => r.text()).then(txt => {
                hideLoader();
                try { cb(JSON.parse(txt)); } catch(e) { alert("錯誤：" + txt); }
            }).catch(err => { hideLoader(); alert("連線失敗"); });
        }

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            showLoader("登入中...");
            callApi("checkCode", {code: code}, function(res){
                if(res.valid) {
                    localStorage.setItem("pass_code", code);
                    window.location.href = "main.html"; // 跳轉至主畫面
                } else alert("❌ 代碼錯誤");
            });
        }

        function doRegister() {
            showLoader("註冊中...");
            callApi("register", {}, function(res){
                localStorage.setItem("pass_code", res.code);
                alert("您的代碼是: " + res.code);
                window.location.href = "main.html";
            });
        }

        window.onload = function() {
            var savedCode = localStorage.getItem("pass_code");
            if (savedCode && savedCode !== "undefined") {
                window.location.href = "main.html"; // 已登入則直接跳轉
            }
        };
    </script>
</body>
</html>
