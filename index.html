<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冰箱小管家 - 登入</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #f4f7f6;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .login-box {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        h1 { margin-top: 0; color: #3498db; font-size: 26px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }
        
        input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 2px solid #eee; border-radius: 10px;
            box-sizing: border-box; font-size: 18px;
            text-align: center; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #3498db; }
        
        button {
            width: 100%; padding: 12px;
            background: #3498db; color: white;
            border: none; border-radius: 10px;
            font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            transition: 0.2s;
        }
        button:active { transform: scale(0.96); }
        button:disabled { background: #ccc; box-shadow: none; }
        
        #loading { display: none; margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🥦 冰箱小管家</h1>
        <p>輸入代碼以開始同步</p>
        
        <input type="text" id="passCode" placeholder="例如：1234" onkeyup="if(event.key==='Enter') doLogin()">
        <button id="btn" onclick="doLogin()">進入冰箱</button>
        <div id="loading">正在連線...</div>
    </div>

    <script>
        // ⚠️ 請換成你重新部署後的網址
        var API_URL = "https://script.google.com/macros/s/AKfycbwOl7qyvxoYNlLjoChG5jZAFmfg2n6OKO9nOse6DsBrAjE45wxdUhWe-0krIxbHepuq/exec";

        function doLogin() {
            var code = document.getElementById("passCode").value.trim();
            if (!code) return alert("請輸入代碼");

            var btn = document.getElementById("btn");
            var loading = document.getElementById("loading");

            // UI 狀態切換
            btn.disabled = true;
            loading.style.display = "block";

            // 使用最相容的 application/x-www-form-urlencoded 方式 (舊版常用)
            // 配合剛修正的 code.gs，這裡會走 e.parameter 路線
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "action=getList&code=" + encodeURIComponent(code)
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success") {
                    // 登入成功
                    localStorage.setItem("pass_code", code);
                    // 順便把資料存起來，讓主畫面開啟更快
                    localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    window.location.href = "main.html";
                } else {
                    alert("連線失敗：" + res.error);
                    resetUI();
                }
            })
            .catch(e => {
                console.error(e);
                // 容錯機制：如果 fetch 失敗，通常是網路問題，但為了讓舊使用者能用
                // 我們可以選擇「只要有輸入代碼就放行」(如果不介意安全性的話)
                // 但為了保險，這裡我們還是報錯
                alert("無法連線，請檢查網路。");
                resetUI();
            });
        }

        function resetUI() {
            document.getElementById("btn").disabled = false;
            document.getElementById("loading").style.display = "none";
        }

        // 自動填入上次代碼
        window.onload = function() {
            var saved = localStorage.getItem("pass_code");
            if(saved) document.getElementById("passCode").value = saved;
        }
    </script>
</body>
</html>
