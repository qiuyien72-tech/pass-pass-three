<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 登入</title>
    <style>
      /* --- 全局設定：深色背景 + 筆記質感 --- */
      body { 
        font-family: 'Courier New', Courier, "PMingLiU", serif; /* 打字機/襯線風格 */
        background: #2b2e38; /* 深色桌面背景 */
        margin: 0; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh;
        overflow: hidden;
      }

      /* --- 筆記紙張容器 --- */
      #loginBox { 
        max-width: 320px; 
        width: 85%; 
        background: #fdfbf7; /* 米黃色紙張 */
        padding: 50px 30px; 
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5); /* 桌面陰影 */
        transform: rotate(-1deg); /* 微微傾斜，隨性感 */
        background-image: radial-gradient(#d1d1d1 1px, transparent 1px); /* 點狀格線 */
        background-size: 20px 20px;
      }
      
      /* --- 紙膠帶裝飾效果 --- */
      #loginBox::before {
        content: '';
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 35px;
        background: rgba(255, 255, 255, 0.4);
        border-left: 2px dashed rgba(255,255,255,0.2);
        border-right: 2px dashed rgba(255,255,255,0.2);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        backdrop-filter: blur(2px);
      }

      h2 {
        text-align: center;
        color: #333;
        border-bottom: 3px double #333;
        display: inline-block;
        padding-bottom: 5px;
        margin-top: 0;
        width: 100%;
      }

      /* --- 輸入框：去框線，改為底線 --- */
      input { 
        width: 100%; 
        padding: 10px 5px; 
        margin-bottom: 25px; 
        background: transparent;
        border: none;
        border-bottom: 2px solid #555;
        border-radius: 0;
        font-family: inherit;
        font-size: 18px;
        text-align: center;
        color: #000;
        transition: border-color 0.3s;
      }
      input:focus {
        outline: none;
        border-bottom: 2px solid #e74c3c; /* 聚焦時變紅色 */
      }
      input::placeholder {
        color: #999;
        font-size: 14px;
        font-style: italic;
      }

      /* --- 按鈕：印章風格 --- */
      button { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 15px; 
        border: 2px solid #333; 
        background: #333; 
        color: #fff; 
        font-weight: bold; 
        font-family: inherit;
        cursor: pointer; 
        font-size: 16px;
        letter-spacing: 1px;
        transition: all 0.2s;
        box-shadow: 3px 3px 0px rgba(0,0,0,0.2); /* 硬陰影 */
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px rgba(0,0,0,0.2);
      }
      
      /* 次要按鈕 */
      .secondary { 
        background: transparent; 
        color: #333; 
        border: 2px dashed #333;
        box-shadow: none;
      }
      .secondary:hover {
        background: rgba(0,0,0,0.05);
      }

      /* --- Loader (保持原本功能，改樣式) --- */
      #loader { 
        position: fixed; top:0; left:0; width:100%; height:100%; 
        background: rgba(43, 46, 56, 0.95); /* 深色遮罩 */
        display:none; justify-content:center; align-items:center; flex-direction:column; 
        z-index: 1000; 
      }
      .spinner { 
        border: 4px solid rgba(255,255,255,0.1); 
        border-top: 4px solid #00ffcc; /* 霓虹綠 */
        border-radius: 50%; 
        width: 45px; height: 45px; 
        animation: spin 0.8s linear infinite; 
        margin-bottom: 15px; 
        box-shadow: 0 0 15px #00ffcc; /* 發光效果 */
      }
      #loaderText { 
        color: #00ffcc; 
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold; font-size: 16px; letter-spacing: 2px; text-shadow: 0 0 5px #00ffcc;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">SYSTEM CONNECTING...</div>
    </div>

    <div id="loginBox">
        <h2>📝 FRIDGE LOG</h2>
        <div style="text-align:center; margin-bottom:20px; font-size:12px; color:#666;">
            請輸入存取代碼以解鎖
        </div>
        
        <input type="text" id="codeIn" placeholder="ACCESS CODE" style="text-align:center; text-transform:uppercase;">
        
        <button onclick="doLogin()">[ ENTER / 進入 ]</button>
        <button class="secondary" onclick="doRegister()">+ 產生新代碼</button>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";
        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            
            showLoader("VERIFYING...");
            // 修改 action 為 checkCode (根據 INDEX.txt 的邏輯，但需注意如果 API 不支援 checkCode，請改回 getList 測試)
            // 根據你的 CODE.txt，後端沒有 "checkCode"，但 INDEX.txt 原本是用 checkCode? 
            // 為了保險起見，這裡我保留你原本 INDEX.txt 的寫法。如果原本能動，這裡就能動。
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getList", code: code }) }) // *修正*: 根據 CODE.txt，用 getList 來測試代碼是否有效比較穩
            .then(r => r.json()).then(res => {
                if(res.status === "success" || (res.data && res.data.length >= 0)) { // 寬鬆判斷
                    showLoader("ACCESS GRANTED");
                    localStorage.setItem("pass_code", code);
                    if(res.data) localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    setTimeout(() => window.location.href = "main.html", 500);
                } else {
                    hideLoader();
                    alert("❌ 代碼錯誤");
                }
            }).catch(e => { hideLoader(); alert("連線失敗"); });
        }

        function doRegister() {
            showLoader("GENERATING...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "create" }) }) // *修正*: CODE.txt 裡 action 是 "create"
            .then(r => r.json()).then(res => {
                localStorage.setItem("pass_code", res.data.code);
                alert("註冊成功！代碼: " + res.data.code);
                window.location.href = "main.html";
            });
        }
        window.onload = function() { if(localStorage.getItem("pass_code")) window.location.href = "main.html"; };
    </script>
</body>
</html>
