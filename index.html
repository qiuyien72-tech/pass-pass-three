<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 登入</title>
    <style>
      body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
      #loginBox { max-width: 350px; width: 90%; background: white; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      input, button { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
      button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
      .secondary { background: white; color: #3498db; border: 2px dashed #3498db; }
      #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:none; justify-content:center; align-items:center; flex-direction:column; z-index: 1000; }
      .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
      #loaderText { color: #555; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">連線中...</div>
    </div>

    <div id="loginBox">
        <h2>📦 冰箱小管家</h2>
        <input type="text" id="codeIn" placeholder="輸入專屬代碼" style="text-align:center; text-transform:uppercase;">
        <button onclick="doLogin()">🚀 登入</button>
        <button class="secondary" onclick="doRegister()">🎲 產生新代碼</button>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";

        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function doLogin() {
            var code = document.getElementById("codeIn").value.toUpperCase().trim();
            if(!code) return alert("請輸入代碼");
            
            showLoader("極速驗證中...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkCode", code: code }) })
            .then(r => r.json()).then(res => {
                if(res.valid) {
                    showLoader("成功！進入中...");
                    localStorage.setItem("pass_code", code);
                    if(res.data) localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    window.location.href = "main.html";
                } else {
                    hideLoader();
                    alert("❌ 代碼錯誤");
                }
            }).catch(e => { hideLoader(); alert("連線失敗"); });
        }

        function doRegister() {
            showLoader("申請中...");
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "register" }) })
            .then(r => r.json()).then(res => {
                localStorage.setItem("pass_code", res.code);
                alert("註冊成功！代碼: " + res.code);
                window.location.href = "main.html";
            });
        }
        window.onload = function() { if(localStorage.getItem("pass_code")) window.location.href = "main.html"; };
    </script>
</body>
</html>
