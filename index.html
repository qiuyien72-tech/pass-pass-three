<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冰箱小管家 - 登入</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 { margin-top: 0; color: #3498db; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #3498db; }
        
        button {
            width: 100%;
            padding: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }

        /* Loading 動畫 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
            display: none; /* 預設隱藏 */
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🥦 冰箱小管家</h1>
        <p>請輸入您的冰箱代碼以同步資料</p>
        
        <input type="text" id="passCode" placeholder="例如：family123" onkeyup="checkEnter(event)">
        <button id="loginBtn" onclick="doLogin()">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">進入冰箱</span>
        </button>

        <div class="note">
            如果是第一次使用，請自訂一組代碼（例如電話號碼），並將此代碼分享給家人即可共用清單。
        </div>
    </div>

    <script>
        // ⚠️ 請務必確認這裡的網址跟 main.html 裡的一模一樣
        var API_URL = "https://script.google.com/macros/s/AKfycbzCEMspx-rMM-evz16IYOyeit1KVhvbH4kAnYWdP3ZK-wKN42tFfS1jf7xtXnwINNs/exec";

        function checkEnter(e) {
            if (e.key === "Enter") doLogin();
        }

        function doLogin() {
            var code = document.getElementById("passCode").value.trim();
            if (!code) return alert("請輸入代碼！");

            var btn = document.getElementById("loginBtn");
            var spinner = document.getElementById("btnSpinner");
            var btnText = document.getElementById("btnText");

            // 鎖定按鈕與顯示 Loading
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "連線中...";

            // 測試連線：嘗試向後端請求該代碼的清單
            // 注意：這裡使用 action: "getList" 來測試代碼是否能正常溝通
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getList", code: code })
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === "success") {
                    // 連線成功，儲存代碼
                    localStorage.setItem("pass_code", code);
                    
                    // 如果後端有回傳資料，先快取起來，加速進入主畫面的體驗
                    if (res.data) {
                        localStorage.setItem("cached_fridge_data", JSON.stringify(res.data));
                    }
                    
                    // 跳轉到主畫面
                    window.location.href = "main.html"; 
                } else {
                    alert("連線失敗：" + (res.error || "未知錯誤"));
                    resetBtn();
                }
            })
            .catch(e => {
                console.error(e);
                alert("無法連線到伺服器，請檢查網路或 API 網址。");
                resetBtn();
            });
        }

        function resetBtn() {
            var btn = document.getElementById("loginBtn");
            var spinner = document.getElementById("btnSpinner");
            var btnText = document.getElementById("btnText");
            
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "進入冰箱";
        }

        // 頁面載入時，如果已經有代碼，自動填入 (可選)
        window.onload = function() {
            var saved = localStorage.getItem("pass_code");
            if (saved) {
                document.getElementById("passCode").value = saved;
            }
        };
    </script>
</body>
</html>
