<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
         --paper-white: #ffffff;
         --highlight-gray: #f4f4f4;
         --border-thick: 3px solid var(--ink);
      }
      
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* 統一的 50px 網格背景 */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 50px 50px;
        margin: 0; 
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      /* 中央大方框 (Container) */
      .menu-box {
        background: var(--paper-white);
        width: 100%;
        max-width: 650px;
        border: var(--border-thick);
        padding: 40px;
        box-shadow: 15px 15px 0 rgba(0,0,0,0.1); /* 硬陰影，增加立體感 */
        position: relative;
      }

      /* 標題裝飾 */
      .box-header {
        border-bottom: var(--border-thick);
        padding-bottom: 20px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .box-title {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -1px;
        margin: 0;
        text-transform: uppercase;
      }
      .box-subtitle {
        font-size: 0.9rem;
        color: #666;
        font-family: monospace;
      }

      /* 選項列表 (List) */
      .option-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 單個選項按鈕 (Item) */
      .option-item {
        display: flex;
        align-items: stretch;
        text-decoration: none;
        color: var(--ink);
        border: 2px solid #ccc; /* 預設淺灰框 */
        transition: all 0.2s ease;
        background: #fff;
        cursor: pointer;
      }

      /* 滑鼠移過去的效果 */
      .option-item:hover {
        border-color: var(--ink); /* 變黑框 */
        transform: translate(-4px, -4px); /* 浮起 */
        box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
        background: var(--highlight-gray);
      }

      /* 左側標籤 (Label) */
      .opt-label {
        background: var(--ink);
        color: #fff;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        writing-mode: vertical-lr; /* 直書文字，增加設計感 */
        text-orientation: upright;
        letter-spacing: 3px;
        min-width: 50px;
        font-size: 14px;
      }
      
      /* 手機版改回橫書 */
      @media (max-width: 600px) {
        .opt-label {
            writing-mode: horizontal-tb;
            padding: 10px;
            min-width: auto;
            width: 80px;
        }
        .option-item {
            flex-direction: row; /* 保持左右排列 */
        }
      }

      /* 右側文字內容 (Content) */
      .opt-content {
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .opt-title {
        font-weight: 900;
        font-size: 1.2rem;
        margin-bottom: 5px;
        text-decoration: underline;
        text-decoration-thickness: 3px;
      }
      .opt-desc {
        font-size: 1rem;
        line-height: 1.6;
        color: #444;
      }

      /* 針對不同按鈕的顏色微調 (Hover時) */
      .item-expired:hover .opt-title { text-decoration-color: #e74c3c; }
      .item-soon:hover .opt-title { text-decoration-color: #f1c40f; }
      .item-all:hover .opt-title { text-decoration-color: #2ecc71; }

      /* 登出按鈕 */
      .logout-link {
        display: block;
        text-align: right;
        margin-top: 30px;
        font-size: 0.9rem;
        color: #666;
        text-decoration: none;
        font-weight: bold;
      }
      .logout-link:hover { text-decoration: underline; color: #000; }

    </style>
</head>
<body>

    <div class="menu-box">
        <div class="box-header">
            <h1 class="box-title">DASHBOARD</h1>
            <span class="box-subtitle">v2.0 // SELECT VIEW</span>
        </div>

        <div class="option-list">
            
            <a href="main.html?filter=expired" class="option-item item-expired">
                <div class="opt-label">已過期</div>
                <div class="opt-content">
                    <div class="opt-title">EXPIRED LIST</div>
                    <div class="opt-desc">左側已過期清單<br>可篩選只有已過期物品</div>
                </div>
            </a>

            <a href="main.html?filter=soon" class="option-item item-soon">
                <div class="opt-label">快過期</div>
                <div class="opt-content">
                    <div class="opt-title">EXPIRING SOON</div>
                    <div class="opt-desc">左側快過期清單<br>可篩選只有快過期物品</div>
                </div>
            </a>

            <a href="main.html" class="option-item item-all">
                <div class="opt-label">主畫面</div>
                <div class="opt-content">
                    <div class="opt-title">MAIN VIEW</div>
                    <div class="opt-desc">主畫面顯示<br>已過期、快過期、未過期物品</div>
                </div>
            </a>

        </div>

        <a href="javascript:localStorage.clear();location.href='index.html'" class="logout-link">[ LOGOUT SYSTEM ]</a>
    </div>

</body>
</html>
