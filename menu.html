<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
      }
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* --- 修改：將網格大小統一調整為 50px --- */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 50px 50px; /* 這裡改成 50px */
        margin: 0; 
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      .menu-container {
        position: relative;
        width: 100%;
        max-width: 800px; 
        margin: 0 auto;
        /* 稍微加一點白色底襯，讓圖片更突出 */
        background: rgba(255,255,255,0.2);
        box-shadow: 0 0 50px 30px rgba(255,255,255,0.2);
      }

      .bg-img {
        width: 100%;
        height: auto;
        display: block;
        /* 讓圖片白底變透明，線條與背景融合 */
        mix-blend-mode: multiply;
        filter: contrast(1.1);
      }

      .nav-btn {
        position: absolute;
        width: 28%; 
        height: 12%; 
        background: rgba(255, 255, 255, 0.0); 
        border: 2px dashed transparent; 
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 1.2rem;
        color: transparent; 
        border-radius: 10px;
        z-index: 10;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.8);
        border-color: var(--ink);
        color: var(--ink);
        box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
      }
      
      @media (max-width: 768px) {
        .nav-btn {
          background: rgba(255, 255, 255, 0.3);
          border: 2px dashed #888;
        }
      }

      /* 按鈕定位 */
      #btn-expired { bottom: 36%; left: 6%; }
      #btn-all { bottom: 21%; left: 6%; }

      .logout-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #333;
        color: white;
        border: none;
        padding: 8px 15px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.8;
        z-index: 20;
      }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="1518.jpg" alt="Menu" class="bg-img">
        <a href="main.html" class="nav-btn" id="btn-expired">⚠️ 已過期清單</a>
        <a href="main.html" class="nav-btn" id="btn-all">📦 全部物品</a>
    </div>

    <button class="logout-btn" onclick="localStorage.clear(); location.href='index.html'">EXIT</button>

</body>
</html>
