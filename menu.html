<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
      }
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* 維持一致的網格紙背景 */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 20px 20px;
        margin: 0; 
        padding: 0; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 圖片容器 */
      .menu-container {
        position: relative;
        width: 100%;
        max-width: 800px; /* 限制最大寬度，避免圖片過大 */
        margin: 0 auto;
      }

      /* 背景圖 */
      .bg-img {
        width: 100%;
        height: auto;
        display: block;
        /* 稍微加一點陰影讓紙張浮起來 */
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
      }

      /* 按鈕共用樣式 */
      .nav-btn {
        position: absolute;
        width: 28%; /* 根據圖片比例調整 */
        height: 12%; /* 根據圖片比例調整 */
        background: rgba(255, 255, 255, 0.0); /* 預設透明 */
        border: 2px dashed transparent; 
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 1.2rem;
        color: transparent; /* 文字預設透明，滑鼠移過去才顯示 */
        border-radius: 10px;
      }

      /* 滑鼠經過時的效果：顯示虛線框與文字 */
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.8);
        border-color: var(--ink);
        color: var(--ink);
        box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
      }
      
      /* 手機版直接顯示框線，方便點擊 */
      @media (max-width: 768px) {
        .nav-btn {
          background: rgba(255, 255, 255, 0.5);
          border: 2px dashed #999;
          color: #333;
          font-size: 1rem;
        }
      }

      /* --- 定位按鈕 (根據 1518.jpg 的方框位置推算) --- */
      
      /* 按鈕 1：已過期 (對應左上文字泡泡的描述) */
      /* 假設放在方框的上半部 */
      #btn-expired {
        bottom: 35%; 
        left: 6%;
      }

      /* 按鈕 2：主選單/全部 (對應右邊文字泡泡的描述) */
      /* 假設放在方框的下半部 */
      #btn-all {
        bottom: 20%; 
        left: 6%;
      }

      /* 登出按鈕 (右下角) */
      .logout-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: #333;
        color: white;
        border: none;
        padding: 8px 15px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.8;
      }

    </style>
</head>
<body>

    <div class="menu-container">
        <img src="1518.jpg" alt="Menu" class="bg-img">

        <a href="main.html" class="nav-btn" id="btn-expired">⚠️ 已過期清單</a>
        <a href="main.html" class="nav-btn" id="btn-all">📦 全部物品</a>
    </div>

    <button class="logout-btn" onclick="localStorage.clear(); location.href='index.html'">EXIT</button>

</body>
</html>
