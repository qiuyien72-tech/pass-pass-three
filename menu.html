<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
         --paper-white: #ffffff;
         --tape-color: rgba(255, 255, 255, 0.6); /* 半透明膠帶 */
         --highlight-red: rgba(255, 69, 58, 0.1);
         --highlight-yellow: rgba(255, 241, 0, 0.1);
      }
      
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* 統一的 50px 網格背景 */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 50px 50px;
        margin: 0; 
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        overflow: hidden;
      }

      /* 標題區塊 */
      .board-header {
        margin-bottom: 50px;
        text-align: center;
        background: #000;
        color: #fff;
        padding: 10px 30px;
        transform: rotate(-1deg);
        box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
      }
      .board-header h1 {
        margin: 0;
        font-size: 1.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* 公佈欄容器 */
      .board-container {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 800px;
      }

      /* --- 便條紙按鈕 (Note Card) --- */
      .note-card {
        position: relative;
        background: var(--paper-white);
        width: 260px;
        height: 200px;
        border: 2px solid var(--ink);
        padding: 30px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        cursor: pointer;
        
        /* 讓紙張有點陰影，像浮在牆上 */
        box-shadow: 10px 10px 0 rgba(0,0,0,0.1); 
      }

      /* 膠帶效果 (CSS 畫出來的) */
      .note-card::before {
        content: '';
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 30px;
        background: rgba(220, 220, 220, 0.5); /* 霧面膠帶色 */
        border-left: 2px dotted rgba(0,0,0,0.1); /* 兩邊撕痕 */
        border-right: 2px dotted rgba(0,0,0,0.1);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        z-index: 10;
      }

      /* 左邊的紙條 (稍微往左歪) */
      .card-left {
        transform: rotate(-3deg);
      }
      .card-left:hover {
        transform: rotate(0deg) scale(1.05); /* 滑鼠移上去轉正並放大 */
        z-index: 5;
        box-shadow: 15px 15px 0 rgba(0,0,0,0.15);
      }
      /* 給左邊紙條一點紅色螢光筆背景 */
      .card-left {
        background-image: repeating-linear-gradient(
          45deg,
          var(--paper-white),
          var(--paper-white) 10px,
          var(--highlight-red) 10px,
          var(--highlight-red) 20px
        );
      }

      /* 右邊的紙條 (稍微往右歪) */
      .card-right {
        transform: rotate(2deg);
      }
      .card-right:hover {
        transform: rotate(0deg) scale(1.05);
        z-index: 5;
        box-shadow: 15px 15px 0 rgba(0,0,0,0.15);
      }
      /* 給右邊紙條一點黃色螢光筆背景 */
      .card-right {
        background-image: repeating-linear-gradient(
          -45deg,
          var(--paper-white),
          var(--paper-white) 10px,
          var(--highlight-yellow) 10px,
          var(--highlight-yellow) 20px
        );
      }

      /* 卡片內的文字 */
      .icon {
        font-size: 3rem;
        margin-bottom: 15px;
        display: block;
      }
      .title {
        font-size: 1.4rem;
        font-weight: 700;
        border-bottom: 3px solid var(--ink); /* 粗底線 */
        padding-bottom: 5px;
      }
      .desc {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #666;
        font-family: monospace;
      }

      /* 登出按鈕 (右下角貼紙) */
      .logout-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: var(--ink);
        color: white;
        border: 2px solid var(--ink);
        padding: 10px 20px;
        font-family: inherit;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
      }
      .logout-btn:hover {
        transform: translate(-3px, -3px);
        box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
      }
      .logout-btn:active {
        transform: translate(0, 0);
        box-shadow: none;
      }

      /* 手機版適配 */
      @media (max-width: 600px) {
        .board-container {
          flex-direction: column;
          align-items: center;
          gap: 30px;
        }
        .note-card {
          width: 80%; /* 手機上寬一點 */
          height: 160px;
        }
        .board-header h1 {
            font-size: 1.4rem;
        }
      }
    </style>
</head>
<body>

    <div class="board-header">
        <h1>DASHBOARD</h1>
    </div>

    <div class="board-container">
        <a href="main.html?filter=expired" class="note-card card-left">
            <span class="icon">⚠️</span>
            <span class="title">EXPIRED</span>
            <span class="desc">查看已過期清單</span>
        </a>

        <a href="main.html" class="note-card card-right">
            <span class="icon">📦</span>
            <span class="title">INVENTORY</span>
            <span class="desc">管理所有物品</span>
        </a>
    </div>

    <button class="logout-btn" onclick="localStorage.clear(); location.href='index.html'">EXIT</button>

</body>
</html>
