<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
      }
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* 背景網格設定 (50px) */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 50px 50px;
        margin: 0; 
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      .menu-container {
        position: relative;
        width: 100%;
        max-width: 800px; 
        margin: 0 auto;
        /* 移除底色塊，讓去背圖直接浮在網格上 */
        background: transparent;
        box-shadow: none;
      }

      .bg-img {
        width: 100%;
        height: auto;
        display: block;
        /* --- 核心修改 --- */
        /* 因為是去背圖，不需要 mix-blend-mode 了 */
        /* 加一點白色邊緣光暈和陰影，讓它像剪下來的貼紙 */
        filter: drop-shadow(0 5px 15px rgba(0,0,0,0.15));
      }

      .nav-btn {
        position: absolute;
        width: 28%; 
        height: 12%; 
        background: rgba(255, 255, 255, 0.0); /* 平常透明 */
        border: 2px dashed transparent; /* 平常無框 */
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 1.2rem;
        color: transparent; 
        border-radius: 15px; /* 圓角大一點 */
        z-index: 10;
      }

      /* 滑鼠移過去時 */
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.9); /* 變成半透明白紙 */
        border: 2px dashed var(--ink); /* 出現虛線框 */
        color: var(--ink); /* 出現文字 */
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        transform: translateY(-2px); /* 微微浮起 */
      }
      
      @media (max-width: 768px) {
        .nav-btn {
          /* 手機版為了好按，給一點微微的提示框 */
          border: 2px dashed rgba(0,0,0,0.1);
        }
        .nav-btn:active {
           background: rgba(255, 255, 255, 0.8);
           border-color: var(--ink);
           color: var(--ink);
        }
      }

      /* 按鈕定位 (根據去背圖的位置，可能需要微調) */
      #btn-expired { bottom: 36%; left: 6%; }
      #btn-all { bottom: 21%; left: 6%; }

      .logout-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #333;
        color: white;
        border: none;
        padding: 8px 15px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.8;
        z-index: 20;
        box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
      }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="1518.png" alt="Menu" class="bg-img">

        <a href="main.html" class="nav-btn" id="btn-expired">⚠️ 已過期清單</a>
        <a href="main.html" class="nav-btn" id="btn-all">📦 全部物品</a>
    </div>

    <button class="logout-btn" onclick="localStorage.clear(); location.href='index.html'">EXIT</button>

</body>
</html>
