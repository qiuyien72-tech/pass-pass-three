<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <title>冰箱小管家 - 選單</title>
    <style>
      :root {
         --ink: #333;
      }
      body { 
        font-family: 'Courier Prime', 'Noto Sans TC', monospace;
        background-color: #fff;
        /* 背景網格 (50px) */
        background-image: 
            linear-gradient(#e5e5e5 1px, transparent 1px),
            linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 50px 50px;
        margin: 0; 
        padding: 0; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 主容器 */
      .menu-container {
        position: relative;
        width: 100%;
        max-width: 600px; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* --- 狗狗圖片處理核心 (黑線手繪風) --- */
      .dog-img {
        width: 320px;
        height: auto;
        
        /* 步驟 1: 反轉顏色 (Invert) */
        /* 把原本的「黑底白線」變成「白底黑線」 */
        /* contrast(1.2) 加強對比，讓線條更黑更清楚 */
        filter: invert(1) contrast(1.5);
        
        /* 步驟 2: 去除背景 (Multiply) */
        /* 色彩增值：會把白色變透明，只保留黑色線條 */
        /* 這樣狗狗就會像直接畫在網格紙上一樣 */
        mix-blend-mode: multiply;
        
        position: relative;
        z-index: 1;
        opacity: 0.9; /* 稍微透明一點點，讓質感更像墨水 */
      }

      /* --- CSS 手繪風對話框按鈕 --- */
      .bubble-btn {
        position: absolute;
        background: #fff;
        border: 3px solid var(--ink);
        padding: 15px 25px;
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
        z-index: 10;
        box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        transition: transform 0.2s, box-shadow 0.2s;
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-width: 140px;
      }

      .bubble-btn:hover {
        transform: translate(-2px, -2px) scale(1.05);
        box-shadow: 8px 8px 0 rgba(0,0,0,0.15);
        background: #fffdf5;
      }

      .bubble-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
      }

      /* 左邊按鈕：過期清單 */
      #btn-expired {
        top: 30%;
        left: 5%;
        transform: rotate(-5deg);
      }
      #btn-expired:hover { transform: rotate(-5deg) scale(1.05) translate(-2px, -2px); }

      /* 右邊按鈕：全部物品 */
      #btn-all {
        bottom: 30%;
        right: 5%;
        transform: rotate(3deg);
      }
      #btn-all:hover { transform: rotate(3deg) scale(1.05) translate(-2px, -2px); }

      /* 連接線 (黑色) */
      .line-connector {
        position: absolute;
        width: 60px;
        height: 2px;
        background: var(--ink);
        z-index: 0;
      }
      .line-left { top: 35%; left: 28%; transform: rotate(20deg); }
      .line-right { bottom: 35%; right: 28%; transform: rotate(-20deg); }

      /* 手機版調整 */
      @media (max-width: 600px) {
        .dog-img { width: 250px; }
        .bubble-btn { padding: 10px 20px; font-size: 1rem; min-width: 110px; }
        #btn-expired { top: 20%; left: 5%; }
        #btn-all { bottom: 25%; right: 5%; }
        .line-connector { display: none; }
      }

      .logout-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #333;
        color: white;
        border: none;
        padding: 8px 15px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.8;
        z-index: 100;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      }
    </style>
</head>
<body>

    <div class="menu-container">
        <a href="main.html?filter=expired" class="bubble-btn" id="btn-expired">
            ⚠️<br>已過期
        </a>
        
        <div class="line-connector line-left"></div>

        <img src="1518.jpg" alt="Menu Dog" class="dog-img">

        <div class="line-connector line-right"></div>

        <a href="main.html" class="bubble-btn" id="btn-all">
            📦<br>全部物品
        </a>
    </div>

    <button class="logout-btn" onclick="localStorage.clear(); location.href='index.html'">EXIT</button>

</body>
</html>
