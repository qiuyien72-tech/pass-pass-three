<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 主畫面</title>
    </head>
<body>
    <script>
        // ... API_URL 與 callApi 保持不變 ...

        window.onload = function() {
            var code = localStorage.getItem("pass_code");
            if(!code) return window.location.href = "index.html";
            
            var codeEl = document.getElementById("displayCode");
            if(codeEl) codeEl.innerText = code;

            // 🚀 速度關鍵：立刻讀取快取（登入時就已經備好了）
            var cached = localStorage.getItem("cached_fridge_data");
            if(cached) {
                try { 
                    allData = JSON.parse(cached); 
                    renderList(); // 秒速渲染
                } catch(e) { allData = []; }
                
                // 背景靜默同步，使用者感覺不到在載入
                refreshData(code, true);
            } else {
                // 只有完全沒資料時才顯示轉圈圈
                refreshData(code, false);
            }
        };

        // ... 其餘函數 (doAdd, sendData, renderList, refreshData) 保持上個版本的穩定版 ...
    </script>
</body>
</html>
