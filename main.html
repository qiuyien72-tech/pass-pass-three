<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 主畫面</title>
    <style>
      body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
      #appSection { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); min-height: 400px; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
      input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
      button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
      .btn-row { display: flex; gap: 8px; }
      .card { border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; background: #fff; position: relative; }
      .card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 12px; cursor: pointer; background: #eee; }
      .creator-tag { font-size: 12px; color: #6c5ce7; background: #f0f0ff; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
      .tag { font-size: 11px; padding: 2px 6px; border-radius: 8px; color: white; margin-top: 4px; display: inline-block; }
      .bg-green { background: #2ecc71; } .bg-yellow { background: #f1c40f; } .bg-red { background: #e74c3c; }
      
      /* 🚀 圖片燈箱 */
      #imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
      #imageModal img { max-width: 90%; max-height: 80vh; border-radius: 10px; }
      
      /* 🚀 強化版 Loader 與文字 */
      #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:none; justify-content:center; align-items:center; flex-direction:column; z-index: 9999; }
      .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
      #loaderText { color: #333; font-weight: bold; font-size: 16px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">正在連線...</div>
    </div>
    
    <div id="imageModal" onclick="this.style.display='none'">
        <img id="largeImgDisplay" src="">
        <p style="color:white; margin-top:15px; font-size:14px;">點擊任何處關閉</p>
    </div>

    <div id="appSection">
        <div class="header">
            <div>我的冰箱 <b id="displayCode">讀取中...</b></div>
            <button onclick="doLogout()" style="width:auto; padding:4px 10px; background:#e74c3c; font-size:12px;">登出</button>
        </div>

        <input type="text" id="inCreator" list="cHistory" placeholder="👤 購買人">
        <datalist id="cHistory"></datalist>
        <input type="text" id="inName" placeholder="🍎 食品名稱">
        <input type="text" id="inLoc" placeholder="🧊 放置位置">
        <input type="date" id="inDate">

        <div class="btn-row">
            <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="document.getElementById('pText').innerText='已選照片'">
            <button style="background:#f39c12;" onclick="document.getElementById('fileIn').click()">📷 拍照</button>
            <button onclick="doAdd()">🚀 加入清單</button>
        </div>
        <div id="pText" style="font-size:12px; color:#aaa; text-align:center; margin-bottom:10px;"></div>
        
        <input type="text" id="search" placeholder="🔍 搜尋名稱、位置、購買人..." onkeyup="renderList()">
        <div id="list"></div>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbyLfPZJis94_sHnG93ll4Mop4ud9cCxm0ZiGwzIEZU4sNdHZ33RGLT-kyF4mVkm3JOR/exec";
        var allData = [];

        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function openModal(src) {
            document.getElementById("largeImgDisplay").src = src;
            document.getElementById("imageModal").style.display = "flex";
        }

        function callApi(action, payload, cb, silent) {
            payload.action = action;
            if(!silent) {
                let msg = "正在處理...";
                if(action === "add") msg = "正在上傳食材與照片...";
                if(action === "delete") msg = "正在從冰箱移除食材...";
                if(action === "getList") msg = "正在同步最新清單...";
                showLoader(msg);
            }
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json()).then(res => { hideLoader(); cb(res); }).catch(e => hideLoader());
        }

        function doLogout() { localStorage.clear(); window.location.href = "index.html"; }

        function doAdd() {
            var name = document.getElementById("inName").value.trim();
            var date = document.getElementById("inDate").value;
            if(!name || !date) return alert("必填項目未輸入");
            
            var pl = { code: localStorage.getItem("pass_code"), name: name, loc: document.getElementById("inLoc").value, date: date, creator: document.getElementById("inCreator").value, image: "" };
            var f = document.getElementById("fileIn").files[0];
            
            if(f) {
                showLoader("正在編碼並準備上傳圖片..."); // 🚀 針對大圖片的特別提示
                var r = new FileReader(); r.readAsDataURL(f);
                r.onload = function(e) { 
                    pl.image = e.target.result.split(",")[1]; 
                    send(pl); 
                };
            } else send(pl);
        }
        function send(pl) { callApi("add", pl, () => { 
            document.getElementById("inName").value = ""; 
            document.getElementById("pText").innerText = "";
            refreshData(pl.code, false); 
        }); }

        function renderList() {
            var listDiv = document.getElementById("list");
            var key = document.getElementById("search").value.toLowerCase();
            var today = new Date(); today.setHours(0,0,0,0);
            var html = "";
            var filtered = allData.filter(i => {
                var s = String(i.name||"") + String(i.location||"") + String(i.creator||"");
                return s.toLowerCase().includes(key);
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            filtered.forEach(item => {
                var d = new Date(item.date);
                var diff = Math.ceil((d - today)/86400000);
                var cls = diff < 0 ? "bg-red" : (diff <= 7 ? "bg-yellow" : "bg-green");
                html += `<div class="card">
                    <img src="${item.imgUrl || ''}" onclick="openModal(this.src)">
                    <div style="flex:1">
                        <div><b>${item.name}</b> <span class="creator-tag">👤 ${item.creator || ''}</span></div>
                        <div style="font-size:13px; color:#666">📍 ${item.location}</div>
                        <div class="tag ${cls}">${diff < 0 ? '已過期' : '剩 '+diff+' 天'} (${item.date})</div>
                    </div>
                    <button style="width:auto; background:none; color:#ccc; border:none; font-size:20px;" onclick="doDel(${item.rowId})">✕</button>
                </div>`;
            });
            listDiv.innerHTML = html || "<p style='text-align:center;color:#999'>目前沒有食品資料</p>";
        }

        function doDel(id) { 
            if(confirm("確定要刪除嗎？")) {
                callApi("delete", { id: id }, function(res) {
                    if(res.status === "Deleted") {
                        localStorage.removeItem("cached_fridge_data");
                        refreshData(localStorage.getItem("pass_code"), false);
                    }
                });
            }
        }

        function refreshData(code, silent) {
            callApi("getList", {code: code}, res => {
                allData = res.data || [];
                localStorage.setItem("cached_fridge_data", JSON.stringify(allData));
                renderList();
                var hist = [...new Set(allData.map(i => i.creator))].filter(c => c);
                document.getElementById("cHistory").innerHTML = hist.map(c => `<option value="${c}">`).join("");
            }, silent);
        }

        window.onload = function() {
            var code = localStorage.getItem("pass_code");
            if(!code) return window.location.href = "index.html";
            document.getElementById("displayCode").innerText = code;
            var cached = localStorage.getItem("cached_fridge_data");
            if(cached) {
                try { allData = JSON.parse(cached); renderList(); } catch(e){}
                refreshData(code, true);
            } else {
                showLoader("正在連線 Google 資料庫...");
                refreshData(code, false);
            }
        };
    </script>
</body>
</html>
