<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 儀表板</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* --- 全域設定：居家溫馨配色 (Warm Grey) + 科技字體 --- */
      body { 
          font-family: 'Noto Sans TC', sans-serif;
          background: #f0f2f5; /* 柔和灰底 */
          margin: 0; 
          padding: 20px; 
          color: #444; 
          padding-bottom: 120px; 
      }
      
      /* --- 主容器：移除白色卡片背景，改為透明佈局 --- */
      #appSection { 
          max-width: 600px;
          margin: 0 auto; 
          background: transparent; /* 透明 */
          padding: 0; 
          min-height: 400px;
      }

      /* --- 標頭與登出 --- */
      .header { 
          display: flex; 
          justify-content: space-between; 
          align-items: center; 
          margin-bottom: 25px; 
          padding: 0 10px;
      }
      .header div { font-size: 24px; font-weight: 700; color: #2c3e50; }
      #displayCode { 
          background: #e0e5ec; padding: 2px 8px; border-radius: 6px; 
          font-family: monospace; color: #666; font-size: 0.8em;
      }
      
      /* --- 輸入控制台 (Input Console) --- */
      /* 這是唯一保留"區塊感"的地方，但做得像控制面板 */
      .input-console {
          background: white;
          padding: 20px;
          border-radius: 20px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* 極淡陰影 */
          margin-bottom: 30px;
      }

      input, button { 
          width: 100%; 
          padding: 12px 15px; 
          margin-bottom: 12px; 
          border-radius: 12px;
          border: 1px solid #eee; 
          background: #f9f9f9;
          box-sizing: border-box; 
          font-size: 15px;
          transition: all 0.2s;
      }
      input:focus {
          background: #fff;
          border-color: #3498db;
          outline: none;
      }

      button { 
          border: none;
          font-weight: 500; 
          cursor: pointer; 
          letter-spacing: 1px;
      }
      button:active { transform: scale(0.98); }
      
      .btn-row { display: flex; gap: 10px; }
      
      /* 主要按鈕樣式 - 溫馨色調 */
      #mainActionBtn { background: #2c3e50; color: white; } /* 深藍灰 */
      
      /* --- 核心修改：清單樣式 (非卡片) --- */
      
      /* 搜尋列 - 懸浮感 */
      #search {
          border-radius: 50px;
          padding-left: 20px;
          border: none;
          background: white;
          box-shadow: 0 4px 15px rgba(0,0,0,0.05);
          margin-bottom: 25px;
      }

      /* 群組容器 - 去除邊框，僅留間距 */
      .group-container {
          background: transparent;
          border: none;
          box-shadow: none;
          margin-bottom: 20px;
          border-radius: 0;
      }

      /* 群組標題 - 簡約線條風 */
      .group-header {
          padding: 10px 5px;
          background: transparent;
          cursor: pointer;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 2px solid #e0e5ec; /* 粗底線作為區隔 */
          transition: all 0.2s;
          color: #2c3e50;
      }
      .group-header:hover { opacity: 0.7; }
      .group-header.active { border-bottom-color: #3498db; } /* 展開時變色 */

      .group-title { font-weight: 700; font-size: 18px; display: flex; align-items: center; }
      .arrow-icon { margin-right: 10px; font-size: 10px; color: #bbb; transition: 0.3s; }
      .group-header.active .arrow-icon { transform: rotate(90deg); color: #3498db; }

      /* 群組內容 - 平滑展開 */
      .group-body {
          display: none;
          background: transparent;
          padding: 0;
          margin-top: 5px;
      }

      /* 單一項目 - 列 (Row) 設計，非卡片 */
      .card { 
          border: none;
          border-bottom: 1px solid #eee; /* 僅保留底線 */
          padding: 15px 5px; 
          margin-bottom: 0; 
          border-radius: 0; 
          display: flex; 
          align-items: center; 
          background: transparent; 
          position: relative; 
          transition: background 0.2s;
      }
      /* Hover 效果：游標移過去時顯示淡淡的光棒 */
      .card:hover {
          background: rgba(255,255,255,0.6);
      }
      
      /* 暫存項目與刪除特效 */
      .card.temp-item { background: rgba(243, 156, 18, 0.1); }
      .card.pending-item { border: 1px dashed #3498db; background: #f0f8ff; border-radius: 10px; margin-bottom:10px;}
      
      .chk-wrapper { display: flex; align-items: center; padding-right: 15px; }
      .del-checkbox { width: 20px; height: 20px; accent-color: #e74c3c; cursor: pointer; }

      /* 圖片圓角化 - 像頭像一樣 */
      .card img { 
          width: 45px; height: 45px; 
          object-fit: cover; 
          border-radius: 50%; /* 圓形 */
          margin-right: 15px; 
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
          cursor: pointer; 
          background: #eee; 
      }
      
      /* 文字標籤優化 */
      .creator-tag { 
          font-size: 12px; color: #888; 
          background: transparent; 
          padding: 0; font-weight: normal;
          margin-right: 5px;
      }
      
      /* 狀態燈號 (取代原本的長方形 Tag) */
      .status-dot {
          display: inline-block;
          width: 8px; height: 8px;
          border-radius: 50%;
          margin-right: 5px;
      }
      .bg-green { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; } /* 螢光綠光暈 */
      .bg-yellow { background-color: #f1c40f; box-shadow: 0 0 5px #f1c40f; }
      .bg-red { background-color: #e74c3c; box-shadow: 0 0 5px #e74c3c; }
      
      .date-text { font-size: 12px; color: #888; display: flex; align-items: center; margin-top: 4px;}

      /* 隱藏舊的 Tag 樣式，改用上面的 .status-dot */
      .tag { display: none; } 

      /* --- 圖片燈箱 (維持深色酷炫感) --- */
      #imageModal { 
          display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
          background: rgba(0,0,0,0.95); z-index: 10000; 
          justify-content: center; align-items: center; flex-direction: column;
          backdrop-filter: blur(5px);
      }
      #imageModal img { max-width: 90%; max-height: 80vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
      
      /* --- 掃描與 Loader 特效 (保持 Sci-Fi 感) --- */
      #loader { 
          position: fixed; top:0; left:0; width:100%; height:100%; 
          background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
          display:none; justify-content:center; align-items:center; flex-direction:column; z-index: 9999; 
      }
      .spinner { 
          border: 3px solid rgba(0,0,0,0.1); border-top: 3px solid #333; 
          border-radius: 50%; width: 40px; height: 40px; 
          animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; /* 更有彈性的動畫 */
          margin-bottom: 15px; 
      }
      #loaderText { color: #333; font-weight: 500; letter-spacing: 1px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      #scanOverlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(10, 20, 30, 0.95); /* 深藍黑 */
          z-index: 10001;
          display: none; flex-direction: column; justify-content: center; align-items: center;
      }
      .scan-box {
          width: 250px; height: 250px; 
          border: 2px solid rgba(0, 255, 200, 0.3); /* 青色科技線 */
          border-radius: 20px; position: relative; overflow: hidden;
          background: url('https://media.istockphoto.com/id/1199736573/vector/qr-code-scanning-icon.jpg?s=612x612&w=0&k=20&c=X7t1ZkM_k_oBq_aXz2ok_o_k_o_k_o_k_o_k_o_k=') no-repeat center/cover;
          box-shadow: 0 0 20px rgba(0, 255, 200, 0.1);
      }
      .scan-line { 
          width: 100%; height: 2px; background: #00ffc8; 
          box-shadow: 0 0 15px #00ffc8;
          position: absolute; top: 0; animation: scanMove 2s ease-in-out infinite; 
      }
      .scan-text { color: #00ffc8; margin-top: 25px; font-size: 16px; letter-spacing: 3px; }
      @keyframes scanMove { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

      /* --- 浮動按鈕群 (Glassmorphism) --- */
      .float-btn {
          position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
          padding: 12px 25px; border-radius: 50px; font-size: 15px; font-weight: 500;
          box-shadow: 0 10px 20px rgba(0,0,0, 0.15);
          display: none; z-index: 5000; width: auto; cursor: pointer; color: white; border: none;
          backdrop-filter: blur(5px);
      }
      #bulkDelBtn { background: rgba(231, 76, 60, 0.9); }
      #bulkAddBtn { background: rgba(46, 204, 113, 0.9); }

      /* 批量模式切換 */
      .mode-switch { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 10px; font-size: 13px; color: #888; }
      .active-mode { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">讀取冰箱數據...</div>
    </div>
    
    <div id="scanOverlay">
        <div class="scan-box"><div class="scan-line"></div></div>
        <div class="scan-text">SCANNING...</div>
    </div>

    <button id="bulkDelBtn" class="float-btn" onclick="doMultiDelete()">🗑️ 刪除選取 (0)</button>
    <button id="bulkAddBtn" class="float-btn" onclick="doMultiAddUpload()">📤 確認上傳 (0)</button>

    <div id="imageModal" onclick="this.style.display='none'">
        <img id="largeImgDisplay" src="">
        <p style="color:#aaa; margin-top:15px; font-size:12px; letter-spacing:1px;">TAP TO CLOSE</p>
    </div>

    <div id="appSection">
        <div class="header">
            <div>My Fridge <span style="font-size:12px; color:#aaa; font-weight:normal;">/ Dashboard</span></div>
            <div style="display:flex; align-items:center; gap:10px;">
                <b id="displayCode">...</b>
                <button onclick="doLogout()" style="width:auto; padding:5px 12px; background:#eee; color:#666; font-size:12px; border-radius:20px; margin:0;">登出</button>
            </div>
        </div>

        <div class="input-console">
            <div class="mode-switch">
                <label style="display:flex;align-items:center;cursor:pointer">
                    <input type="checkbox" id="batchModeToggle" onchange="toggleBatchMode()" style="width:auto; margin-right:5px;">
                    <span id="modeText">批量模式</span>
                </label>
            </div>

            <input type="text" id="inCreator" list="cHistory" placeholder="👤 購買人">
            <datalist id="cHistory"></datalist>
            <input type="text" id="inName" placeholder="🍎 食品名稱">
            <input type="text" id="inLoc" placeholder="🧊 放置位置 (如: 上層)">
            <input type="date" id="inDate">

            <div class="btn-row">
                <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="document.getElementById('pText').innerText='✅ 已選取'">
                <button style="background:#f39c12; color:white; flex:1;" onclick="document.getElementById('fileIn').click()">📷 拍照</button>
                <button id="mainActionBtn" onclick="doAdd()" style="flex:2;">加入清單</button>
            </div>
            <div id="pText" style="font-size:12px; color:#2ecc71; text-align:center; margin-bottom:0; height:15px;"></div>
        </div>
        
        <div id="pendingArea" style="display:none; margin-bottom:20px;">
            <div style="font-size:14px; color:#3498db; margin-bottom:10px; font-weight:bold; padding-left:10px;">📦 暫存區</div>
            <div id="pendingList"></div>
        </div>

        <input type="text" id="search" placeholder="🔍 搜尋冰箱..." onkeyup="renderList()">
        <div id="list"></div>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";
        var allData = [];
        var pendingData = []; 
        var isBatchMode = false;

        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function openModal(src) {
            document.getElementById("largeImgDisplay").src = src;
            document.getElementById("imageModal").style.display = "flex";
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                var reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    var img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var MAX_WIDTH = 800; 
                        var scaleSize = MAX_WIDTH / img.width;
                        if (scaleSize > 1) scaleSize = 1;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        var ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL("image/jpeg", 0.7).split(",")[1]); 
                    }
                }
            });
        }

        function callApi(action, payload, cb, silent) {
            payload.action = action;
            if(!silent) {
                let msg = "處理中...";
                if(action === "delete") msg = "同步中...";
                if(action === "deleteMulti") msg = "批量刪除中...";
                if(action === "addMulti") msg = "批量上傳中...";
                if(action === "getList") msg = "同步冰箱數據...";
                showLoader(msg);
            }
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json()).then(res => {
                if(!silent) hideLoader();
                cb(res);
            }).catch(e => { hideLoader(); console.error(e); });
        }

        function doLogout() { localStorage.clear(); window.location.href = "index.html"; }

        function toggleBatchMode() {
            var checkbox = document.getElementById("batchModeToggle");
            isBatchMode = checkbox.checked;
            var btn = document.getElementById("mainActionBtn");
            var txt = document.getElementById("modeText");
            var pArea = document.getElementById("pendingArea");
            if(isBatchMode) {
                btn.innerText = "➕ 加入暫存";
                btn.style.background = "#2ecc71"; 
                txt.classList.add("active-mode");
                pArea.style.display = "block";
            } else {
                btn.innerText = "加入清單";
                btn.style.background = "#2c3e50"; 
                txt.classList.remove("active-mode");
                if(pendingData.length === 0) pArea.style.display = "none";
            }
            renderPendingList();
        }

        function doAdd() {
            var name = document.getElementById("inName").value.trim();
            var date = document.getElementById("inDate").value;
            var loc = document.getElementById("inLoc").value;
            var creator = document.getElementById("inCreator").value;
            var file = document.getElementById("fileIn").files[0];
            if(!name || !date) return alert("請輸入名稱與日期");

            var processData = (base64Img) => {
                var newItem = {
                    name: name, loc: loc, date: date, creator: creator, image: base64Img || ""
                };
                if (isBatchMode) {
                    pendingData.push(newItem);
                    renderPendingList();
                    document.getElementById("inName").value = "";
                    document.getElementById("pText").innerText = "";
                    document.getElementById("fileIn").value = "";
                    if(navigator.vibrate) navigator.vibrate(50);
                } else {
                    var scanOverlay = document.getElementById("scanOverlay");
                    scanOverlay.style.display = 'flex';
                    
                    setTimeout(() => {
                        scanOverlay.style.display = 'none';
                        var tempId = Date.now();
                        var tempItem = {
                            rowId: tempId, name: name, location: loc, date: date, creator: creator, 
                            imgUrl: base64Img ? "data:image/jpeg;base64," + base64Img : "",
                            isTemp: true
                        };
                        allData.unshift(tempItem);
                        renderList(); 
                        document.getElementById("inName").value = "";
                        document.getElementById("pText").innerText = "";
                        document.getElementById("fileIn").value = "";

                        var pl = { code: localStorage.getItem("pass_code"), ...newItem };
                        callApi("add", pl, (res) => { updateLocalData(res.data); }, true);
                    }, 2000); // 縮短掃描時間增加流暢感
                }
            };

            if(file) compressImage(file).then(base64 => processData(base64));
            else processData("");
        }

        function renderPendingList() {
            var div = document.getElementById("pendingList");
            var btn = document.getElementById("bulkAddBtn");
            
            if(pendingData.length > 0) {
                btn.style.display = "block";
                btn.innerText = "📤 確認上傳 (" + pendingData.length + ")";
                
                var html = pendingData.map((item, idx) => `
                    <div class="card pending-item">
                        <div style="flex:1">
                            <div style="font-weight:bold; color:#2c3e50;">${item.name}</div>
                            <div style="font-size:12px; color:#666">${item.date} / ${item.loc}</div>
                        </div>
                        <button style="width:auto; background:none; color:#e74c3c; border:none; font-size:18px;" onclick="removePending(${idx})">✕</button>
                    </div>
                 `).join("");
                div.innerHTML = html;
            } else {
                btn.style.display = "none";
                div.innerHTML = "<div style='text-align:center;color:#ccc;font-size:12px;padding:10px;'>暫存區是空的</div>";
            }
        }

        function removePending(idx) {
            pendingData.splice(idx, 1);
            renderPendingList();
        }

        function doMultiAddUpload() {
            if(pendingData.length === 0) return;
            if(!confirm("確定要一次上傳這 " + pendingData.length + " 筆資料嗎？")) return;

            var scanOverlay = document.getElementById("scanOverlay");
            scanOverlay.style.display = 'flex';
            document.querySelector(".scan-text").innerText = "BATCH PROCESSING...";
            setTimeout(() => {
                var code = localStorage.getItem("pass_code");
                pendingData.forEach(item => {
                    var tempItem = {
                        rowId: Date.now() + Math.random(), 
                        name: item.name, location: item.loc, date: item.date, creator: item.creator, 
                        imgUrl: item.image ? "data:image/jpeg;base64," + item.image : "",
                        isTemp: true
                    };
                    allData.unshift(tempItem);
                });
                renderList();
                
                callApi("addMulti", { items: pendingData, code: code }, function(res) {
                    scanOverlay.style.display = 'none';
                    pendingData = [];
                    renderPendingList();
                    updateLocalData(res.data);
                    document.querySelector(".scan-text").innerText = "SCANNING...";
                }, true);
            }, 2000);
        }

        function doDel(id) { 
            if(confirm("確定要刪除嗎？")) {
                allData = allData.filter(item => item.rowId !== id);
                renderList(); 
                var code = localStorage.getItem("pass_code");
                callApi("delete", { id: id, code: code }, function(res) { updateLocalData(res.data); }, true);
            }
        }

        function doMultiDelete() {
            var checkboxes = document.querySelectorAll('.del-checkbox:checked');
            var idsToDelete = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (idsToDelete.length === 0) return;
            if (!confirm("確定要刪除選取的 " + idsToDelete.length + " 項資料嗎？")) return;
            allData = allData.filter(item => !idsToDelete.includes(item.rowId));
            renderList();
            var code = localStorage.getItem("pass_code");
            callApi("deleteMulti", { ids: idsToDelete, code: code }, function(res) { updateLocalData(res.data); }, true);
        }

        function checkSelection() {
            var count = document.querySelectorAll('.del-checkbox:checked').length;
            var btn = document.getElementById("bulkDelBtn");
            if (count > 0) { btn.style.display = "block";
            btn.innerText = "🗑️ 刪除選取 (" + count + ")"; } 
            else { btn.style.display = "none";
            }
        }

        function updateLocalData(newData) {
            allData = newData || [];
            localStorage.setItem("cached_fridge_data", JSON.stringify(allData));
            renderList();
            var hist = [...new Set(allData.map(i => i.creator))].filter(c => c);
            document.getElementById("cHistory").innerHTML = hist.map(c => `<option value="${c}">`).join("");
        }

        function toggleGroup(groupId) {
            var body = document.getElementById('group-body-' + groupId);
            var header = document.getElementById('group-header-' + groupId);
            
            if (body.style.display === "none" || body.style.display === "") {
                body.style.display = "block";
                header.classList.add("active");
            } else {
                body.style.display = "none";
                header.classList.remove("active");
            }
        }

        function renderList() {
            var listDiv = document.getElementById("list");
            var key = document.getElementById("search").value.toLowerCase();
            var today = new Date(); today.setHours(0,0,0,0);
            
            var filtered = allData.filter(i => {
                var s = String(i.name||"") + String(i.location||"") + String(i.creator||"");
                return s.toLowerCase().includes(key);
            });
            if (filtered.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center;color:#ccc; margin-top:30px;'>— 冰箱是空的 —</p>";
                checkSelection();
                return;
            }

            var groups = {};
            filtered.forEach(item => {
                var nameKey = item.name || "未命名";
                if(!groups[nameKey]) groups[nameKey] = [];
                groups[nameKey].push(item);
            });
            var html = "";

            var sortedGroupKeys = Object.keys(groups).sort((keyA, keyB) => {
                var datesA = groups[keyA].map(i => new Date(i.date).getTime());
                var datesB = groups[keyB].map(i => new Date(i.date).getTime());
                return Math.min(...datesA) - Math.min(...datesB);
            });
            
            sortedGroupKeys.forEach((groupName, groupIndex) => {
                var items = groups[groupName];
                items.sort((a,b) => new Date(a.date) - new Date(b.date));
      
                var count = items.length;
                var earliestDate = items[0].date;
                
                var d = new Date(earliestDate);
                var diff = Math.ceil((d - today)/86400000);
                // 使用 CSS class 定義的顏色變數，這裡只取狀態顏色文字供 Header 使用
                var statusColor = diff < 0 ? "#e74c3c" : (diff <= 7 ? "#f1c40f" : "#2ecc71");
                var statusText = diff < 0 ? '已過期' : (diff <= 7 ? '快過期' : '正常');

                var subCardsHtml = items.map(item => {
                    var iDate = new Date(item.date);
                    var iDiff = Math.ceil((iDate - today)/86400000);
                    // 根據日期狀態決定小圓點的顏色 Class
                    var dotClass = iDiff < 0 ? "bg-red" : (iDiff <= 7 ? "bg-yellow" : "bg-green");
                    
                    var checkHTML = item.isTemp ? "" : 
                        `<div class="chk-wrapper"><input type="checkbox" class="del-checkbox" value="${item.rowId}" onchange="checkSelection()"></div>`;
                    return `
                        <div class="card ${item.isTemp ? 'temp-item' : ''}">
                            ${checkHTML}
                            <img src="${item.imgUrl || ''}" onclick="event.stopPropagation(); openModal(this.src)" onerror="this.style.display='none'">
                            <div style="flex:1">
                                <div style="display:flex; align-items:center;">
                                    <span style="font-weight:500; font-size:16px; margin-right:8px;">${item.creator || '未知'}</span>
                                    <span style="font-size:12px; color:#aaa; background:#f4f4f4; padding:2px 6px; border-radius:4px;">${item.location}</span>
                                </div>
                                <div class="date-text">
                                    <span class="status-dot ${dotClass}"></span>
                                    ${item.date} (${iDiff}天)
                                </div>
                            </div>
                            ${item.isTemp ? '<span style="font-size:12px;color:#f39c12">SYNC...</span>' : 
                            `<button style="width:auto; background:none; color:#ddd; border:none; font-size:18px;" onclick="event.stopPropagation(); doDel(${item.rowId})">✕</button>`}
                        </div>
                    `;
                }).join("");

                html += `
                    <div class="group-container">
                        <div class="group-header" id="group-header-${groupIndex}" onclick="toggleGroup(${groupIndex})">
                            <div class="group-title">
                                <span class="arrow-icon">▶</span>
                                <span>${groupName}</span>
                                <span style="font-size:12px; background:#f0f2f5; padding:2px 8px; border-radius:10px; margin-left:8px; color:#888;">${count}</span>
                            </div>
                            <div style="text-align:right;">
                                <div style="color:${statusColor}; font-weight:bold; font-size:13px;">${statusText}</div>
                                <div style="color:#ccc; font-size:11px;">${earliestDate}</div>
                            </div>
                        </div>
                        <div class="group-body" id="group-body-${groupIndex}">
                            ${subCardsHtml}
                        </div>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
            checkSelection(); 
        }

        function refreshData(code, silent) {
            callApi("getList", {code: code}, res => updateLocalData(res.data), silent);
        }

        window.onload = function() {
            var code = localStorage.getItem("pass_code");
            if(!code) return window.location.href = "index.html";
            document.getElementById("displayCode").innerText = code;
            var cached = localStorage.getItem("cached_fridge_data");
            if(cached) {
                try { allData = JSON.parse(cached); renderList(); } catch(e){}
                refreshData(code, true);
            } else {
                refreshData(code, false);
            }
        };
    </script>
</body>
</html>
