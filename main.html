<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://script.google.com">
    <title>冰箱小管家 - 筆記模式</title>
    <style>
      /* --- 基礎風格：筆記本質感 --- */
      body { 
        font-family: 'Courier New', Courier, "PMingLiU", serif; /* 等寬字體帶出筆記感 */
        background: #2b2e38; /* 深色桌面 */
        margin: 0; 
        padding: 10px; 
        color: #333; 
        padding-bottom: 100px; 
      }

      /* --- 主要容器：筆記本內頁 --- */
      #appSection { 
        max-width: 600px;
        margin: 0 auto; 
        background: #fdfbf7; /* 紙張顏色 */
        padding: 25px 20px; 
        border-radius: 5px; 
        box-shadow: 5px 5px 0px rgba(0,0,0,0.3); /* 硬陰影，不像浮動卡片 */
        min-height: 80vh;
        border-left: 6px solid #e74c3c; /* 筆記本左側紅線 */
        position: relative;
        /* 橫線背景 */
        background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
        background-size: 100% 30px; /* 行高 */
        line-height: 30px; /* 對齊行高 */
      }

      /* --- Header --- */
      .header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 25px; 
        padding-bottom: 10px;
        border-bottom: 2px solid #333; /* 粗黑線 */
        background: #fdfbf7; /* 蓋住橫線 */
      }
      .header div { font-weight: 900; font-size: 20px; letter-spacing: 1px; }

      /* --- 輸入元件風格 --- */
      input, button { 
        box-sizing: border-box; 
        font-family: inherit; 
      }
      
      /* 輸入框：去除邊框，只留底線，半透明背景 */
      input { 
        width: 100%; 
        padding: 8px 0; 
        margin-bottom: 15px; 
        background: rgba(255,255,255,0.8);
        border: none;
        border-bottom: 2px dashed #999;
        font-size: 16px;
        color: #333;
      }
      input:focus {
        outline: none;
        border-bottom: 2px solid #3498db;
        background: #fff;
      }
      
      /* 按鈕：黑底白字或高亮色 */
      button { 
        width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 0;
        background: #333; color: white; border: 2px solid #333;
        font-weight: bold; cursor: pointer; transition: all 0.2s; 
        box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
      }
      button:active { transform: translate(2px, 2px); box-shadow: none; }
      
      .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
      
      /* --- 列表項目：去卡片化 (No Cards) --- */
      /* 這裡覆蓋原本的 .card 樣式 */
      .card { 
        border: none; /* 移除框線 */
        border-bottom: 1px solid rgba(0,0,0,0.1); /* 僅留分隔線 */
        padding: 10px 0; /* 調整間距 */
        margin-bottom: 0; 
        border-radius: 0; /* 移除圓角 */
        display: flex; 
        align-items: center; 
        background: transparent; /* 透明背景融入筆記紙 */
        position: relative; 
      }
      
      .card.temp-item { 
        background: rgba(243, 156, 18, 0.1); /* 暫存項目稍微 highlight */
        border-bottom: 2px dashed #f39c12;
      }
      .card.pending-item { 
        background: rgba(52, 152, 219, 0.1); 
        border: 1px dashed #3498db;
        margin-bottom: 5px;
      }
      
      .card img { 
        width: 40px; height: 40px; 
        object-fit: cover; 
        border: 2px solid #333; /* 照片加黑框 */
        margin-right: 15px; 
        cursor: pointer; 
        background: #eee; 
        transform: rotate(-3deg); /* 照片隨意感 */
      }

      /* 標籤樣式：螢光筆風格 */
      .creator-tag { 
        font-size: 12px;
        color: #333; 
        background: transparent; 
        border: 1px solid #333;
        padding: 0 4px; 
        font-weight: normal;
        border-radius: 0;
      }
      
      /* 狀態標籤 */
      .tag { 
        font-size: 12px; padding: 0 5px; border-radius: 0; 
        color: #000; font-weight: bold;
        margin-top: 4px; display: inline-block;
      }
      .bg-green { background: #2ecc71; box-shadow: 2px 2px 0 #000; color:white; }
      .bg-yellow { background: #f1c40f; box-shadow: 2px 2px 0 #000; }
      .bg-red { background: #e74c3c; color: white; box-shadow: 2px 2px 0 #000; }

      /* --- 群組樣式：章節分隔 --- */
      .group-container {
          background: transparent;
          border-radius: 0;
          margin-bottom: 10px;
          box-shadow: none;
          border: none;
          overflow: visible;
      }
      
      .group-header {
          padding: 8px 5px;
          background: transparent; /* 透明 */
          cursor: pointer;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 2px solid #333; /* 粗黑線分隔 */
          margin-top: 15px;
      }
      .group-header:hover { background: rgba(0,0,0,0.03); }
      
      /* 選中的群組標題像被螢光筆劃過 */
      .group-header.active .group-title b {
          background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
          padding: 0 5px;
      }

      .group-title { font-weight: bold; font-size: 18px; display: flex; align-items: center; }
      .group-info { font-size: 12px; text-align: right; color: #555; font-family: sans-serif; }
      .arrow-icon { margin-right: 8px; font-size: 10px; color: #333; }
      
      .group-body {
          display: none;
          background: transparent;
          padding: 0;
      }

      /* --- 功能按鈕區 --- */
      .chk-wrapper { display: flex; align-items: center; padding-right: 10px; }
      .del-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #333; }
      
      /* --- 浮動按鈕 (貼紙風格) --- */
      .float-btn {
          position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
          padding: 12px 25px; border-radius: 0; font-size: 16px; font-weight: bold;
          box-shadow: 4px 4px 0 rgba(0,0,0,1); /* 復古硬陰影 */
          display: none; z-index: 5000; width: auto; cursor: pointer; color: white;
          border: 2px solid #fff;
      }
      #bulkDelBtn { background: #e74c3c; }
      #bulkAddBtn { background: #2ecc71; color: #000; }

      /* --- 掃描與特效 (保持酷炫) --- */
      #scanOverlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.9); z-index: 10001;
          display: none; flex-direction: column; justify-content: center; align-items: center;
      }
      .scan-box {
          width: 250px; height: 250px; border: 2px solid #0f0; /* 駭客綠 */
          box-shadow: 0 0 20px #0f0, inset 0 0 20px #0f0;
          border-radius: 10px; position: relative; overflow: hidden;
          background: url('https://media.istockphoto.com/id/1199736573/vector/qr-code-scanning-icon.jpg?s=612x612&w=0&k=20&c=X7t1ZkM_k_oBq_aXz2ok_o_k_o_k_o_k_o_k_o_k=') no-repeat center/cover;
          opacity: 0.8;
      }
      .scan-line { width: 100%; height: 2px; background: #0f0; box-shadow: 0 0 10px #0f0;
          position: absolute; top: 0; animation: scanMove 1.5s ease-in-out infinite; }
      .scan-text { color: #0f0; margin-top: 20px; font-family: monospace; font-size: 20px; font-weight: bold; text-shadow: 0 0 5px #0f0; }
      
      /* --- Loader --- */
      #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(43,46,56,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; z-index: 9999; }
      .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00ffcc; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
      #loaderText { color: #00ffcc; font-weight: bold; font-family: monospace; font-size: 16px; text-shadow: 0 0 5px #00ffcc; }

      /* --- Image Modal --- */
      #imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
      #imageModal img { max-width: 90%; max-height: 80vh; border: 5px solid #fff; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

      /* --- 模式切換 --- */
      .mode-switch { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 10px; font-size: 14px; color: #555; }
      .active-mode { color: #2ecc71; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">SYNCING...</div>
    </div>
    
    <div id="scanOverlay">
        <div class="scan-box"><div class="scan-line"></div></div>
        <div class="scan-text">SCANNING TARGET...</div>
    </div>

    <button id="bulkDelBtn" class="float-btn" onclick="doMultiDelete()">🗑️ ERASE SELECTED (0)</button>
    <button id="bulkAddBtn" class="float-btn" onclick="doMultiAddUpload()">📤 UPLOAD BATCH (0)</button>

    <div id="imageModal" onclick="this.style.display='none'">
        <img id="largeImgDisplay" src="">
        <p style="color:#aaa; margin-top:15px; font-family:monospace;">[ TAP TO CLOSE ]</p>
    </div>

    <div id="appSection">
        <div class="header">
            <div>📋 FRIDGE NOTES</div>
            <div style="font-size:12px; font-family:monospace; color:#555;">ID: <span id="displayCode">...</span></div>
            <button onclick="doLogout()" style="width:auto; margin:0; padding:4px 10px; background:#333; color:#fff; font-size:12px; border:none;">LOGOUT</button>
        </div>

        <div class="mode-switch">
            <label style="display:flex;align-items:center;cursor:pointer">
                 <input type="checkbox" id="batchModeToggle" onchange="toggleBatchMode()" style="width:auto; margin-right:5px; border-bottom:none;">
                <span id="modeText">📝 批量模式 (Batch Mode)</span>
            </label>
        </div>

        <input type="text" id="inCreator" list="cHistory" placeholder="由誰購買 (Creator)...">
        <datalist id="cHistory"></datalist>
        <input type="text" id="inName" placeholder="食品名稱 (Item Name)...">
        <input type="text" id="inLoc" placeholder="位置 (Location)...">
        <input type="date" id="inDate" style="background:transparent;">

        <div class="btn-row">
            <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="document.getElementById('pText').innerText='[ IMAGE SELECTED ]'">
            <button style="background:#fff; color:#333; border:2px dashed #333;" onclick="document.getElementById('fileIn').click()">📷 PHOTO</button>
            <button id="mainActionBtn" onclick="doAdd()">🚀 WRITE ENTRY</button>
        </div>
        <div id="pText" style="font-family:monospace; font-size:12px; color:#e74c3c; text-align:center; margin-bottom:10px;"></div>
        
        <div id="pendingArea" style="display:none; margin-bottom:20px; border: 2px dashed #999; padding: 10px;">
            <div style="font-size:14px; color:#333; margin-bottom:5px; font-weight:bold; text-decoration:underline;">📦 STAGING AREA (暫存)</div>
            <div id="pendingList"></div>
        </div>

        <input type="text" id="search" placeholder="🔍 SEARCH LOGS..." onkeyup="renderList()" style="border-bottom: 3px double #333; margin-top:20px;">
        <div id="list"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 以下 JavaScript 完全保留原樣，僅調整一些文字或邏輯相容
        // ----------------------------------------------------
        var API_URL = "https://script.google.com/macros/s/AKfycby_sDF8GC1jTH1yUN_UM1s_AdIvr0CHgtwiQ-GYMCMj__De6OQAm-NtUQWDn3f8avbD/exec";
        var allData = [];
        var pendingData = []; 
        var isBatchMode = false;

        function showLoader(text) {
            document.getElementById("loaderText").innerText = text;
            document.getElementById("loader").style.display = "flex";
        }
        function hideLoader() { document.getElementById("loader").style.display = "none"; }

        function openModal(src) {
            document.getElementById("largeImgDisplay").src = src;
            document.getElementById("imageModal").style.display = "flex";
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                var reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    var img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var MAX_WIDTH = 800; 
                        var scaleSize = MAX_WIDTH / img.width;
                        if (scaleSize > 1) scaleSize = 1;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        var ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL("image/jpeg", 0.7).split(",")[1]); 
                    }
                }
            });
        }

        function callApi(action, payload, cb, silent) {
            payload.action = action;
            if(!silent) {
                let msg = "PROCESSING...";
                if(action === "delete") msg = "DELETING...";
                if(action === "deleteMulti") msg = "BULK DELETE...";
                if(action === "addMulti") msg = "UPLOADING...";
                if(action === "getList") msg = "SYNCING...";
                showLoader(msg);
            }
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json()).then(res => {
                if(!silent) hideLoader();
                cb(res);
            }).catch(e => { hideLoader(); console.error(e); });
        }

        function doLogout() { localStorage.clear(); window.location.href = "index.html"; }

        function toggleBatchMode() {
            var checkbox = document.getElementById("batchModeToggle");
            isBatchMode = checkbox.checked;
            var btn = document.getElementById("mainActionBtn");
            var txt = document.getElementById("modeText");
            var pArea = document.getElementById("pendingArea");
            if(isBatchMode) {
                btn.innerText = "➕ ADD TO STAGE";
                btn.style.background = "#2ecc71"; 
                btn.style.color = "#000";
                txt.classList.add("active-mode");
                pArea.style.display = "block";
            } else {
                btn.innerText = "🚀 WRITE ENTRY";
                btn.style.background = "#333"; 
                btn.style.color = "#fff";
                txt.classList.remove("active-mode");
                if(pendingData.length === 0) pArea.style.display = "none";
            }
            renderPendingList();
        }

        function doAdd() {
            var name = document.getElementById("inName").value.trim();
            var date = document.getElementById("inDate").value;
            var loc = document.getElementById("inLoc").value;
            var creator = document.getElementById("inCreator").value;
            var file = document.getElementById("fileIn").files[0];
            if(!name || !date) return alert("MISSING FIELDS (必填未填)");

            var processData = (base64Img) => {
                var newItem = {
                    name: name, loc: loc, date: date, creator: creator, image: base64Img || ""
                };
                if (isBatchMode) {
                    pendingData.push(newItem);
                    renderPendingList();
                    document.getElementById("inName").value = "";
                    document.getElementById("pText").innerText = "";
                    document.getElementById("fileIn").value = "";
                    if(navigator.vibrate) navigator.vibrate(50);
                } else {
                    var scanOverlay = document.getElementById("scanOverlay");
                    scanOverlay.style.display = 'flex';
                    
                    setTimeout(() => {
                        scanOverlay.style.display = 'none';
                        
                        var tempId = Date.now();
                        var tempItem = {
                            rowId: tempId, name: name, location: loc, date: date, creator: creator, 
                            imgUrl: base64Img ? "data:image/jpeg;base64," + base64Img : "",
                            isTemp: true
                        };
                        allData.unshift(tempItem);
                        renderList(); 
                        
                        document.getElementById("inName").value = "";
                        document.getElementById("pText").innerText = "";
                        document.getElementById("fileIn").value = "";

                        var pl = { code: localStorage.getItem("pass_code"), ...newItem };
                        callApi("add", pl, (res) => { updateLocalData(res.data); }, true);
                    }, 2000); // Slightly faster animation
                }
            };

            if(file) compressImage(file).then(base64 => processData(base64));
            else processData("");
        }

        function renderPendingList() {
            var div = document.getElementById("pendingList");
            var btn = document.getElementById("bulkAddBtn");
            
            if(pendingData.length > 0) {
                btn.style.display = "block";
                btn.innerText = "📤 UPLOAD BATCH (" + pendingData.length + ")";
                
                var html = pendingData.map((item, idx) => `
                    <div class="card pending-item">
                        <div style="flex:1">
                            <div><b>${item.name}</b> <span style="font-size:12px;color:#666">(${item.date})</span></div>
                            <div style="font-size:12px; color:#666">📍 ${item.location || 'N/A'}</div>
                        </div>
                        <button style="width:auto; background:none; color:#e74c3c; border:none; font-size:20px; box-shadow:none;" onclick="removePending(${idx})">✕</button>
                    </div>
                 `).join("");
                div.innerHTML = html;
            } else {
                btn.style.display = "none";
                div.innerHTML = "<div style='text-align:center;color:#aaa;font-size:12px;padding:10px;'>- EMPTY -</div>";
            }
        }

        function removePending(idx) {
            pendingData.splice(idx, 1);
            renderPendingList();
        }

        function doMultiAddUpload() {
            if(pendingData.length === 0) return;
            if(!confirm("Upload " + pendingData.length + " items?")) return;

            var scanOverlay = document.getElementById("scanOverlay");
            scanOverlay.style.display = 'flex';
            document.querySelector(".scan-text").innerText = "BATCH PROCESSING...";
            setTimeout(() => {
                var code = localStorage.getItem("pass_code");
                pendingData.forEach(item => {
                    var tempItem = {
                        rowId: Date.now() + Math.random(), 
                        name: item.name, location: item.loc, date: item.date, creator: item.creator, 
                        imgUrl: item.image ? "data:image/jpeg;base64," + item.image : "",
                        isTemp: true
                    };
                    allData.unshift(tempItem);
                });
                renderList();
                
                callApi("addMulti", { items: pendingData, code: code }, function(res) {
                    scanOverlay.style.display = 'none';
                    pendingData = [];
                    renderPendingList();
                    updateLocalData(res.data);
                    alert("UPLOAD COMPLETE!");
                    document.querySelector(".scan-text").innerText = "SCANNING TARGET...";
                }, true);
            }, 2000);
        }

        function doDel(id) { 
            if(confirm("Delete this entry?")) {
                allData = allData.filter(item => item.rowId !== id);
                renderList(); 
                var code = localStorage.getItem("pass_code");
                callApi("delete", { id: id, code: code }, function(res) { updateLocalData(res.data); }, true);
            }
        }

        function doMultiDelete() {
            var checkboxes = document.querySelectorAll('.del-checkbox:checked');
            var idsToDelete = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (idsToDelete.length === 0) return;
            if (!confirm("Delete " + idsToDelete.length + " selected items?")) return;
            allData = allData.filter(item => !idsToDelete.includes(item.rowId));
            renderList();
            var code = localStorage.getItem("pass_code");
            callApi("deleteMulti", { ids: idsToDelete, code: code }, function(res) { updateLocalData(res.data); }, true);
        }

        function checkSelection() {
            var count = document.querySelectorAll('.del-checkbox:checked').length;
            var btn = document.getElementById("bulkDelBtn");
            if (count > 0) { btn.style.display = "block";
            btn.innerText = "🗑️ ERASE SELECTED (" + count + ")"; } 
            else { btn.style.display = "none";
            }
        }

        function updateLocalData(newData) {
            allData = newData || [];
            localStorage.setItem("cached_fridge_data", JSON.stringify(allData));
            renderList();
            var hist = [...new Set(allData.map(i => i.creator))].filter(c => c);
            document.getElementById("cHistory").innerHTML = hist.map(c => `<option value="${c}">`).join("");
        }

        function toggleGroup(groupId) {
            var body = document.getElementById('group-body-' + groupId);
            var header = document.getElementById('group-header-' + groupId);
            
            if (body.style.display === "none" || body.style.display === "") {
                body.style.display = "block";
                header.classList.add("active");
            } else {
                body.style.display = "none";
                header.classList.remove("active");
            }
        }

        function renderList() {
            var listDiv = document.getElementById("list");
            var key = document.getElementById("search").value.toLowerCase();
            var today = new Date(); today.setHours(0,0,0,0);
            
            var filtered = allData.filter(i => {
                var s = String(i.name||"") + String(i.location||"") + String(i.creator||"");
                return s.toLowerCase().includes(key);
            });
            if (filtered.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center;color:#999;font-family:monospace;'>[ NO DATA FOUND ]</p>";
                checkSelection();
                return;
            }

            var groups = {};
            filtered.forEach(item => {
                var nameKey = item.name || "UNNAMED";
                if(!groups[nameKey]) groups[nameKey] = [];
                groups[nameKey].push(item);
            });
            var html = "";

            var sortedGroupKeys = Object.keys(groups).sort((keyA, keyB) => {
                var datesA = groups[keyA].map(i => new Date(i.date).getTime());
                var datesB = groups[keyB].map(i => new Date(i.date).getTime());
                return Math.min(...datesA) - Math.min(...datesB);
            });
            sortedGroupKeys.forEach((groupName, groupIndex) => {
                var items = groups[groupName];
                items.sort((a,b) => new Date(a.date) - new Date(b.date));

                var count = items.length;
                var earliestDate = items[0].date;
                var d = new Date(earliestDate);
                var diff = Math.ceil((d - today)/86400000);
                
                // 調整顏色邏輯配合深色/筆記風格
                var statusColor = diff < 0 ? "#e74c3c" : (diff <= 7 ? "#d35400" : "#27ae60");
                var statusText = diff < 0 ? 'EXPIRED' : (diff <= 7 ? 'SOON' : 'OK');

                var subCardsHtml = items.map(item => {
                    var iDate = new Date(item.date);
                    var iDiff = Math.ceil((iDate - today)/86400000);
                    var cls = iDiff < 0 ? "bg-red" : (iDiff <= 7 ? "bg-yellow" : "bg-green");
                    
                    var checkHTML = item.isTemp ? "" : 
                        `<div class="chk-wrapper"><input type="checkbox" class="del-checkbox" value="${item.rowId}" onchange="checkSelection()"></div>`;
                    
                    return `
                        <div class="card ${item.isTemp ? 'temp-item' : ''}">
                            ${checkHTML}
                            <img src="${item.imgUrl || ''}" onclick="event.stopPropagation(); openModal(this.src)" onerror="this.style.display='none'">
                            <div style="flex:1">
                                <div style="display:flex; justify-content:space-between;">
                                    <span class="creator-tag">BY: ${item.creator || '?'}</span>
                                    <span style="font-size:12px;color:#666">@ ${item.location || '_'}</span>
                                </div>
                                <div style="margin-top:2px;">
                                    <span class="tag ${cls}">${item.date} (${iDiff}D)</span>
                                </div>
                            </div>
                            ${item.isTemp ? '<span style="font-size:12px;color:#f39c12">SYNC...</span>' : 
                            `<button style="width:auto; background:none; color:#ccc; border:none; font-size:16px; box-shadow:none;" onclick="event.stopPropagation(); doDel(${item.rowId})">✕</button>`}
                        </div>
                    `;
                }).join("");

                html += `
                    <div class="group-container">
                        <div class="group-header" id="group-header-${groupIndex}" onclick="toggleGroup(${groupIndex})">
                            <div class="group-title">
                                <span class="arrow-icon">▶</span>
                                <b>${groupName}</b>
                                <span style="font-size:10px; border:1px solid #999; padding:0 4px; margin-left:8px; border-radius:50%;">${count}</span>
                            </div>
                            <div class="group-info">
                                <span style="color:${statusColor}; font-weight:bold; border-bottom:2px solid ${statusColor};">${earliestDate}</span>
                            </div>
                        </div>
                        <div class="group-body" id="group-body-${groupIndex}">
                            ${subCardsHtml}
                        </div>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
            checkSelection(); 
        }

        function refreshData(code, silent) {
            callApi("getList", {code: code}, res => updateLocalData(res.data), silent);
        }

        window.onload = function() {
            var code = localStorage.getItem("pass_code");
            if(!code) return window.location.href = "index.html";
            document.getElementById("displayCode").innerText = code;
            var cached = localStorage.getItem("cached_fridge_data");
            if(cached) {
                try { allData = JSON.parse(cached); renderList(); } catch(e){}
                refreshData(code, true);
            } else {
                refreshData(code, false);
            }
        };
    </script>
</body>
</html>
